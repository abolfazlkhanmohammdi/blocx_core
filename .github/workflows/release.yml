name: Release

# Runs when develop is merged into main.
# 1) re-runs the full CI gate, 2) creates tag v<pubspec version> if it does not exist,
# 3) starts publish.yml on that tag. No personal access token / secret is needed:
# tags pushed with GITHUB_TOKEN do not start other workflows, but workflow_dispatch is allowed.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag:
    name: Create release tag and start publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write  # dispatch publish.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG must contain this version
        run: grep -qF "## [${{ steps.v.outputs.version }}]" CHANGELOG.md

      - name: Create tag if missing, then start publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Nothing to release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          # Run the publish workflow at the tag ref (OIDC token will carry refs/tags/$TAG).
          # If pub.dev rejects dispatch-started runs, see the fallback in the notes.
          gh workflow run publish.yml --ref "$TAG"
