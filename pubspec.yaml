name: blocx_core
description: Pure-Dart composable BLoC architecture with mixins and use-cases for paginated collections, reactive forms, and cross-feature event synchronization.
version: 1.1.0
repository: https://github.com/abolfazlkhanmohammdi/blocx_core
issue_tracker: https://github.com/abolfazlkhanmohammdi/blocx_core/issues
topics: [bloc, architecture, lists, forms, state-management]
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  uuid: ^4.5.1
  bloc: ^9.0.0
  meta: ^1.16.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1
  collection: ^1.19.1

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: ^1.24.0
